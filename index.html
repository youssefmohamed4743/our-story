<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>For Jee</title>

  <!-- This is a private gift. Ask search engines to stay out of it.
       (The gate is a romantic front door, not security — see gate.js.) -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070B16" />
  <meta name="description" content="A story, and a letter." />

  <!-- ============================================================
       THE LINK PREVIEW  ·  edit these here, NOT in content.js

       This is the one exception to "you only edit content.js", and
       it is forced on us: link scrapers (WhatsApp, Telegram, iMessage,
       Discord) do not run JavaScript, so they can never read
       content.js. Whatever you want the chat bubble to say has to be
       literal text in this file.

       The image is a designed card, deliberately NOT one of your
       photos: WhatsApp fetches and caches og:image on its own servers
       and shows it in every chat the link is forwarded to.

       ⚠️ AFTER YOU DEPLOY: change og:image to the full absolute URL
       (https://your-site.netlify.app/preview.png). Relative paths work
       in most scrapers but are not guaranteed by any of them.
       ============================================================ -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Our Story" />
  <meta property="og:description" content="A little something, and a letter. Open it when you have a quiet minute." />
  <meta property="og:image"       content="https://youssefmohamed4743.github.io/gift/preview.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card"        content="summary_large_image" />

  <!-- Home screen: she can keep this as an icon and reopen it whenever.
       Launches fullscreen, on the film's own dark, with no browser bar. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Our Story" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" type="image/png" href="favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Two families, and only two.
       Cormorant Garamond = emotion and story · Inter = clarity and interface. -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script>document.documentElement.classList.add('js')</script>

  <link rel="stylesheet" href="./base.css" />
  <link rel="stylesheet" href="./film.css" />
  <link rel="stylesheet" href="./story.css" />
</head>
<body>

  <!-- ============================================================
       THE GATE — the front door. Its submit button is also the
       user gesture that lets the music start; browsers give us
       no other way in.
       ============================================================ -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateQuestion" hidden>
    <div class="gate__inner">
      <p class="gate__intro" id="gateIntro"></p>
      <h1 class="gate__question" id="gateQuestion"></h1>
      <form class="gate__form" id="gateForm" autocomplete="off">
        <label class="sr-only" for="gateInput">Your answer</label>
        <input class="gate__input" id="gateInput" type="text"
               autocomplete="off" autocorrect="off" autocapitalize="none"
               spellcheck="false" enterkeyhint="go" />
        <button class="gate__submit" id="gateSubmit" type="submit"></button>
      </form>
      <p class="gate__hint" id="gateHint" aria-live="polite"></p>
    </div>
    <canvas class="gate__burst" id="gateBurst" aria-hidden="true"></canvas>
  </div>

  <!-- ============================================================
       THE WISH — the first thing she sees after the secret.

       The gate fades out on the same dark ground and this fades
       in over it (z-index 81, between the gate's 80 and the
       volume card's 82), so there is no seam between them.

       It waits. Nothing here advances on a timer and nothing but
       the button advances at all: the point is that SHE starts
       the film, on the beat she chooses. The tap is also a second
       real user gesture, which is a free insurance policy on any
       browser that refused the first one at the gate.

       The words come from content.js like everything else.
       ============================================================ -->
  <div class="wish-card" id="wishCard" role="dialog" aria-modal="true" aria-labelledby="wishCardTitle" hidden>
    <div class="wish-card__inner">
      <h1 class="wish-card__title" id="wishCardTitle">
        <span class="wish-card__greeting" id="wishCardGreeting"></span>
        <span class="wish-card__name" id="wishCardName"></span>
      </h1>

      <!-- Deliberately the gate's button again: same pill, same
           hairline, same rose on hover. She pressed one of these to
           get in, so she already knows what it is and what it does —
           and the two screens read as one hand rather than two. -->
      <button class="wish-card__play" id="wishCardPlay" type="button">
        <svg class="wish-card__tri" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
          <path d="M8 5.4l11 6.6-11 6.6z" fill="currentColor" />
        </svg>
        <span class="wish-card__word" id="wishCardWord"></span>
      </button>
    </div>
  </div>

  <!-- ============================================================
       THE VOLUME CUE — the cinema's "please silence your phones"
       card, in our own language. It sits between the gate and the
       first frame: she has answered, the song has begun under her,
       and this is the beat that tells her to turn it up before the
       film starts.

       role="status" so a screen reader announces it; the words
       come from content.js like everything else. Tapping anywhere
       skips ahead, and it advances by itself regardless.
       ============================================================ -->
  <div class="cue" id="cue" role="status" aria-live="polite" hidden>
    <div class="cue__inner">
      <!-- A speaker, and two arcs that pulse outward like sound
           leaving it. Inline so it inherits the ivory and needs
           no network request. -->
      <svg class="cue__icon" viewBox="0 0 64 48" width="58" height="44" aria-hidden="true">
        <path class="cue__speaker" d="M14 19h7l9-7.5v25L21 29h-7z"
              fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linejoin="round" />
        <path class="cue__wave cue__wave--1" d="M37 19.5a10 10 0 0 1 0 9"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path class="cue__wave cue__wave--2" d="M43 14.5a17 17 0 0 1 0 19"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path class="cue__wave cue__wave--3" d="M49 9.5a24 24 0 0 1 0 29"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>

      <p class="cue__line" id="cueLine"></p>
      <p class="cue__note" id="cueNote"></p>

      <!-- Not decoration: it is the only thing telling her the wait
           is finite, which is the difference between a held beat and
           a page that has frozen. -->
      <span class="cue__meter" aria-hidden="true"><i class="cue__fill" id="cueFill"></i></span>
    </div>
  </div>

  <!-- ============================================================
       THE FILM — a fixed stage that never unmounts. When the film
       ends, this exact frame stays put and becomes the page's
       background; the story scrolls up over it. That continuity
       is the whole trick.
       ============================================================ -->
  <div class="film" id="film" hidden>
    <canvas class="film__canvas" id="filmCanvas" aria-hidden="true"></canvas>

    <!-- The five acts are built from content.js by film.js.
         Deliberately NOT aria-hidden: the film carries real words,
         and in DOM order they read as a plain, linear version of
         the story for anyone who cannot watch it. Only the canvas
         above is decorative. -->
    <div class="film__acts" id="filmActs"></div>

    <button class="skip" id="skip" type="button">
      Skip intro
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
        <path d="M5 5l7 7-7 7M13 5l7 7-7 7" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- The cue that invites the scroll, revealed after the film settles -->
    <div class="outro" id="outro" hidden>
      <p class="outro__text" id="outroText"></p>
      <span class="outro__arrow" aria-hidden="true"></span>
    </div>
  </div>

  <!-- ============================================================
       THE STORY — five sections, all built from content.js by
       story.js. Hidden until the film hands off.
       ============================================================ -->
  <main class="story" id="story" hidden></main>

  <!-- Music toggle: floats over everything, on every section. -->
  <button class="audio" id="audioToggle" type="button" hidden
          aria-pressed="false" aria-label="Mute music">
    <span class="audio__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <!-- Lightbox: a gallery, not a single photo. Arrows, swipe and
       ←/→ move within whichever group she opened (the story chapters
       and the wall are separate groups and never bleed together). -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close">&times;</button>

    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <figure class="lightbox__fig">
      <img class="lightbox__img" id="lightboxImg" alt="" />
      <figcaption class="lightbox__cap" id="lightboxCap"></figcaption>
      <p class="lightbox__count" id="lightboxCount" aria-live="polite"></p>
    </figure>

    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- One lens over the entire experience — film and website alike.
       This shared grain is a big part of why they feel like one piece. -->
  <div class="grade" aria-hidden="true">
    <div class="grade__vignette"></div>
    <div class="grade__grain"></div>
  </div>

  <noscript>
    <p style="padding:3rem 1.5rem;font-family:Georgia,serif;color:#f9e2d2;text-align:center;line-height:1.7">
      This gift needs JavaScript switched on. Everything is waiting behind it.
    </p>
  </noscript>

  <script type="module" src="./main.js"></script>
</body>
</html>
